name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test && bun run lint && bun run pack:check
      - name: Verify release version
        run: |
          version="$(bun -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
      # npm CLI is required for npm's OIDC trusted publishing and provenance exchange.
      - name: Publish contracts
        run: |
          version="$(bun -p "require('./package.json').version")"
          npm view "@hiraya-team/apps-contracts@$version" version >/dev/null 2>&1 || npm publish --access public --provenance
        working-directory: packages/apps-contracts
      - name: Publish SDK
        run: |
          version="$(bun -p "require('./package.json').version")"
          npm view "@hiraya-team/apps-sdk@$version" version >/dev/null 2>&1 || npm publish --access public --provenance
        working-directory: packages/apps-sdk
      - name: Publish CLI
        run: |
          version="$(bun -p "require('./package.json').version")"
          npm view "@hiraya-team/app-cli@$version" version >/dev/null 2>&1 || npm publish --access public --provenance
        working-directory: packages/app-cli
