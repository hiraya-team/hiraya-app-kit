name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test && bun run lint && bun run pack:check
      - name: Verify release version
        run: test "$GITHUB_REF_NAME" = "v$(bun -p \"require('./package.json').version\")"
      # npm CLI is required for npm's OIDC trusted publishing and provenance exchange.
      - run: npm publish --access public --provenance
        working-directory: packages/apps-contracts
      - run: npm publish --access public --provenance
        working-directory: packages/apps-sdk
      - run: npm publish --access public --provenance
        working-directory: packages/app-cli
